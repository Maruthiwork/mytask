server {
    listen 80;
    server_name app.example.com;

    location / {
        proxy_pass http://frontend:80;
    }
}

server {
    listen 80;
    server_name api.example.com;

    location / {
        proxy_pass http://backend1:3000;
    }
}

server {
    listen 80;
    server_name auth.example.com;

    location / {
        proxy_pass http://backend2:3000;
    }
}
