version: 0.0
os: linux

files:
  - source: docker-compose.yaml
    destination: /opt/maruthi-nextjs
  - source: deploy.sh
    destination: /opt/maruthi-nextjs
  - source: image-tag.txt
    destination: /opt/maruthi-nextjs

hooks:
  AfterInstall:
    - location: deploy.sh
      timeout: 600
      runas: root
